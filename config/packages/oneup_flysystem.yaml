# Read the documentation: https://github.com/1up-lab/OneupFlysystemBundle
oneup_flysystem:
    adapters:
        private_uploads:
            local:
                location: '%uploads_private_dir%'

        uploads:
            local:
                location: '%uploads_public_dir%'

    filesystems:
        private_uploads:
            adapter: private_uploads

        uploads:
            adapter: uploads
