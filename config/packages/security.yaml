security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_users:
            entity:
                class: App\Entity\User

        logbook_users:
            memory:
                users:
                    logbook:
                        password: '%env(APP_LOGBOOK_USER_PASSWORD)%'
                        roles: 'ROLE_LOGBOOK_USER'
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        logbook:
            host: '%logbook_host%'
            provider: logbook_users

            http_basic: ~

        main:
            lazy: true
            provider: app_users

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall
            entry_point: App\Security\LoginFormAuthenticator
            custom_authenticators:
                - App\Security\LoginFormAuthenticator

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /
                signature_properties: ['password']

            logout:
                path: app_logout
                # where to redirect after logout
                target: app_login
                enable_csrf: true

            two_factor:
                auth_form_path: 2fa_login    # The route name you have used in the routes.yaml
                check_path: 2fa_login_check  # The route name you have used in the routes.yaml

            # by default, allows 5 login attempts per minute
            login_throttling: ~

            # https://symfony.com/doc/current/security/impersonating_user.html
            switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { host: '%logbook_host%', path: ^/, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/mentions-legales$, roles: PUBLIC_ACCESS }
        - { path: ^/release-notes$, roles: PUBLIC_ACCESS }
        - { path: ^/payment-attestation, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: [ROLE_LOGBOOK_ADMIN, ROLE_MATERIAL_ADMIN, ROLE_SPORT_ADMIN, ROLE_USER_ADMIN, ROLE_SEASON_MEDICAL_CERTIFICATE_ADMIN, ROLE_SEASON_PAYMENTS_ADMIN] }
        - { path: ^/, roles: IS_AUTHENTICATED_REMEMBERED }

    role_hierarchy:
        ROLE_SEASON_ADMIN:
            - ROLE_SEASON_MEDICAL_CERTIFICATE_ADMIN
            - ROLE_SEASON_PAYMENTS_ADMIN
        ROLE_ADMIN:
            - ROLE_LOGBOOK_ADMIN
            - ROLE_MATERIAL_ADMIN
            - ROLE_SEASON_ADMIN
            - ROLE_SPORT_ADMIN
            - ROLE_USER_ADMIN
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_ALLOWED_TO_SWITCH

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
