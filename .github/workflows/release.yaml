name: Continuous Integration - Release

on:
    release:
        types:
            - published

permissions:
    contents: read

jobs:
    tests-phpunit:
        name: Tests

        uses: ./.github/workflows/_phpunit.yaml

    sonarqube:
        name: SonarQube

        needs: tests-phpunit

        uses: ./.github/workflows/_sonarqube.yaml
        secrets:
            sonar_token: ${{ secrets.SONAR_TOKEN }}
