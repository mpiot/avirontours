name: Setup Composer
description: Restore the Composer cache and install vendors

inputs:
    flags:
        description: 'Flags passed to composer install'
        required: false
        default: '--no-interaction --no-progress --optimize-autoloader --prefer-dist'

runs:
    using: composite
    steps:
        - name: Get Composer Cache Directory
          id: composer-cache
          shell: bash
          run: |
              echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

        - name: Composer Cache
          uses: actions/cache@v5
          with:
              path: ${{ steps.composer-cache.outputs.dir }}
              key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
              restore-keys: |
                  ${{ runner.os }}-composer-

        - name: Composer install
          shell: bash
          run: composer install ${{ inputs.flags }}
